<!-- ============================================================
     SIR WADE — MENTORSHIP · 00 HEAD
     PASTE INTO: a Custom Code block at the very TOP of the Mentorship
     page. Kajabi's landing-page builder has no raw head-code field, so
     this block renders in the page body — that's expected.

     Each page loads its OWN bundle (pages/mentorship/dist/), so keep this on
     the page itself, never in a site-wide setting — that would load this
     bundle on every page.

     This is the ONLY block that loads CSS/JS. Every section block
     is pure markup, so without this the page renders unstyled.
     Only the Google Fonts <link> and the jsDelivr <link>/<script>
     are required; the SW_ASSETS and :root blocks are optional
     overrides.
     ============================================================ -->

<!-- Marker: lets the stylesheet collapse the empty Kajabi wrappers around
     this block (it renders nothing, but Kajabi still gives it a full
     section's padding). Harmless anywhere else. -->
<div class="sw-head-marker"></div>

<!-- ── Fonts ──────────────────────────────────────────────── -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700&display=swap"
  rel="stylesheet"
/>

<!-- ── Asset overrides ──────────────────────────────────────
     EDIT THIS BLOCK, NOT THE REPO.
     Every key here overrides the default baked into the CDN bundle
     (shared/js/00-assets.js). Images, GIFs and MP4s all work at the
     same key. Delete a key to fall back to the shipped default. -->
<script>
  window.SW_ASSETS = {
    // brand: { logoCream: "..." },
    // links: { login: "..." }
  };
</script>

<!-- ── Theme overrides (optional) ───────────────────────────
     Any token from shared/css/00-tokens.css can be re-pointed here. -->
<style>
  :root {
    /* --sw-amber: #fab03c; */
  }
</style>

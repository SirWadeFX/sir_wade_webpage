<!-- ============================================================
     SIR WADE — MENTORSHIP · 07 STUDENT WORKS
     PASTE INTO: Custom Code block. Section padding 0, full width.

     Placeholder slots, as in the mockup. Each empty element shows as the
     mockup's outline box and turns into plain content once filled:

       .sw-works-sub   amber box → a subtitle line (write text inside)
       .sw-work-media  white box → an image/video: set works.w1…w4 in
                       the head snippet, or replace the <img> outright
       .sw-work-title  green box → the work's title (write text inside)

     Keep a filled <p>/<figcaption> on ONE line (no stray whitespace) —
     the placeholder style keys off the element being :empty.
     ============================================================ -->

<section class="sw-scope sw-section sw-works">
  <h2 class="sw-mentor-h2">Student Works</h2>
  <p class="sw-works-sub"></p>

  <div class="sw-works-grid">
    <figure class="sw-work">
      <div class="sw-work-media"><img data-sw-src="works.w1" alt="" /></div>
      <figcaption class="sw-work-title"></figcaption>
    </figure>
    <figure class="sw-work">
      <div class="sw-work-media"><img data-sw-src="works.w2" alt="" /></div>
      <figcaption class="sw-work-title"></figcaption>
    </figure>
    <figure class="sw-work">
      <div class="sw-work-media"><img data-sw-src="works.w3" alt="" /></div>
      <figcaption class="sw-work-title"></figcaption>
    </figure>
    <figure class="sw-work">
      <div class="sw-work-media"><img data-sw-src="works.w4" alt="" /></div>
      <figcaption class="sw-work-title"></figcaption>
    </figure>
  </div>
</section>

<!-- ============================================================
     SIR WADE — MENTORSHIP ONE-SHOTS · 00 HEAD
     PASTE INTO: a Custom Code block at the very TOP of the Mentorship
     One-Shots page. Kajabi's landing-page builder has no raw head-code field, so
     this block renders in the page body — that's expected.

     ALSO PASTE pages/mentorship-one-shots/blocks/00-head.css into the page's
     Settings → Custom Code → Custom CSS. That field lands in the real
     <head>, so the stylesheet loads before the page draws.

     Each page loads its OWN bundle (pages/mentorship-one-shots/dist/), so keep this on
     the page itself, never in a site-wide setting — that would load this
     bundle on every page.

     This block and 00-head.css are what load the CSS/JS. Every section
     block is pure markup, so without them the page renders unstyled.
     Only the Google Fonts <link> and the jsDelivr <link>/<script>
     are required; the SW_ASSETS and :root blocks are optional
     overrides.
     ============================================================ -->

<!-- Marker: lets the stylesheet collapse the empty Kajabi wrappers around
     this block (it renders nothing, but Kajabi still gives it a full
     section's padding). Harmless anywhere else. -->
<div class="sw-head-marker"></div>

<!-- Start fetching the heading font before the CSS asks for it — it is the
     last thing to arrive, and the page waits on it (see 00-head.css). -->
<link rel="preload" as="font" type="font/ttf" crossorigin
  href="/resource_redirect/downloads/file-uploads/sites/2147638896/themes/2166357318/downloads/5ec478-b035-13bd-bfea-2f8f6bd53ba7_PalmerLakePrint-Regular.ttf" />

<!-- ── Fonts ────────────────────────────────────────────────
     Lexend is the banner, "coming soon" line and body copy; Poppins the
     "ANIMATION" under the logo. The "Stay in the loop" headline uses
     PalmerLakePrint (Kajabi site head) and Kalam where that isn't loaded. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&family=Lexend:wght@400;500;600;700&family=Poppins:wght@600&display=swap"
  rel="stylesheet"
/>

<!-- ── Asset overrides ──────────────────────────────────────
     EDIT THIS BLOCK, NOT THE REPO.
     Every key here overrides the default baked into the CDN bundle
     (shared/js/00-assets.js). Images, GIFs and MP4s all work at the
     same key. Delete a key to fall back to the shipped default. -->
<script>
  window.SW_ASSETS = {
    // oneShots: {
    //   hero: "https://kajabi-cdn.../one-shots-hero.jpg"
    // },
  };
</script>

<!-- ── Theme overrides (optional) ───────────────────────────
     Any token from shared/css/00-tokens.css can be re-pointed here. -->
<style>
  :root {
    /* --sw-amber: #fab03c; */

    /* COMPACT (the default): content stops growing at 1440px and centres,
       with the banners and bands still full-bleed. For the full-width,
       mockup-scale version, change this to 100000px or delete the line.
       Preview full width locally: pages/<page>/preview-full.html */
    --sw-page-max: 1440px;
    /* --sw-scale: 0.9; */
  }
</style>

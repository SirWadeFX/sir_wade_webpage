<!-- ============================================================
     SIR WADE — SHOT SPRINT MENTORSHIP · 04 INTEREST FORM
     PASTE INTO: Custom Code block. Section padding 0, full width.

     The same newsletter section as the home page, restyled by the
     `sw-loop` modifier (shared/css/85-loop.css) — the Class Library's
     section, unchanged.

     SUBMITTING (shared/js/40-news-form.js): stays on the page, checks the
     name and email, then shows "You're signed up!". It posts to its own
     Kajabi form, `forms.shotSprintInterest` (form 2149763185), not the
     newsletter. Every "I'm interested!" button on the page jumps here.
     ============================================================ -->

<section class="sw-scope sw-section sw-newsletter sw-loop" id="sw-newsletter">
  <div class="sw-wrap sw-news-grid">
    <div>
      <h2 class="sw-display sw-h2">Interested?</h2>
      <p class="sw-news-lead">Shot Sprint is coming soon.</p>
      <p class="sw-news-note">
        Leave your name and email and you&rsquo;ll be the first to hear
        when it opens, with the dates and details.
      </p>
    </div>

    <div class="sw-news-card">
      <form class="sw-news-form" data-sw-form="forms.shotSprintInterest">
        <label class="sw-sr" for="sw-news-name">Name</label>
        <input id="sw-news-name" name="name" type="text" placeholder="Name" />

        <label class="sw-sr" for="sw-news-email">Email</label>
        <input
          id="sw-news-email"
          name="email"
          type="email"
          placeholder="Email"
          required
        />

        <button type="submit">I&rsquo;m interested!</button>
      </form>
    </div>
  </div>
</section>

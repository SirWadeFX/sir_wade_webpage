<!-- ============================================================
     SIR WADE — LIVE MOCAP WORKSHOP · 01 HEADER
     PASTE INTO: a Custom Code block right after the 00 head block.
     Section padding 0, full width.

     The shared dark header (shared/css/15-header.css): the same nav as
     Class Library and Class Info: Classes ⌄ (All Classes · Maya for Animators ·
     Animation Classes · Unreal Engine), Mentorship ⌄ (Personal Mentorship ·
     Shot Sprint), Tutorials (desktop only) and Log in. Dropdowns:
     shared/js/10-nav-menu.js; links: `links.classesMenu.*` and
     `links.mentorshipMenu.*` in the head snippet.
     PHONES (720px and under): hamburger menu on the left (Browse Classes ·
     LBX 2026 · Personal Mentorship · Shot Sprint), the wordmark centred,
     an account silhouette on the right that goes to Log in. Both carry
     `hidden` so they stay out of sight if this markup is ever live before
     the stylesheet that shows them (15-header.css).
     ============================================================ -->

<header class="sw-scope sw-nav is-dark">
  <div class="sw-wrap sw-nav-inner">
    <!-- Phones only: hamburger menu (left) — the desktop links are hidden. -->
    <div class="sw-nav-menu sw-nav-burger" hidden>
      <button class="sw-nav-menu-btn" type="button" aria-expanded="false" aria-controls="sw-mobile-menu">
        <span class="sw-sr">Menu</span>
        <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
      </button>
      <ul class="sw-nav-menu-panel" id="sw-mobile-menu" role="list">
        <li><a data-sw-href="links.catalog" href="#">Browse Classes</a></li>
        <li><a data-sw-href="links.lbx" href="#">LBX 2026</a></li>
        <li><a data-sw-href="links.mentorshipMenu.personal" href="#">Personal Mentorship</a></li>
        <li><a data-sw-href="links.mentorshipMenu.shotSprint" href="#">Shot Sprint</a></li>
      </ul>
    </div>

    <!-- The wordmark image plus "Animation" as live text, so the sub-line
         stays sharp at the mockup's larger size. -->
    <a class="sw-nav-logo has-sub" href="/" aria-label="Sir Wade Animation — home">
      <img data-sw-src="brand.logoCream" alt="" />
      <span class="sw-nav-logo-sub" aria-hidden="true">Animation</span>
    </a>

    <nav class="sw-nav-right" aria-label="Primary">
      <div class="sw-nav-links">
        <div class="sw-nav-menu">
          <button class="sw-nav-menu-btn" type="button" aria-expanded="false" aria-controls="sw-classes-menu">
            Classes
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 9 7 7 7-7" /></svg>
          </button>
          <ul class="sw-nav-menu-panel" id="sw-classes-menu" role="list">
            <li><a data-sw-href="links.classesMenu.all" href="#">All Classes</a></li>
            <li><a data-sw-href="links.classesMenu.maya" href="#">Maya for Animators</a></li>
            <li><a data-sw-href="links.classesMenu.animation" href="#">Animation Classes</a></li>
            <li><a data-sw-href="links.classesMenu.unreal" href="#">Unreal Engine</a></li>
          </ul>
        </div>
        <div class="sw-nav-menu">
          <button class="sw-nav-menu-btn" type="button" aria-expanded="false" aria-controls="sw-mentorship-menu">
            Mentorship
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 9 7 7 7-7" /></svg>
          </button>
          <ul class="sw-nav-menu-panel" id="sw-mentorship-menu" role="list">
            <li><a data-sw-href="links.mentorshipMenu.personal" href="#">Personal Mentorship</a></li>
            <li><a data-sw-href="links.mentorshipMenu.shotSprint" href="#">Shot Sprint</a></li>
          </ul>
        </div>
        <a class="sw-nav-web-only" data-sw-href="links.tutorials" href="#" target="_blank" rel="noopener">Tutorials</a>
      </div>
      <a class="sw-nav-login" data-sw-href="links.login" href="#">Log in</a>
    </nav>

    <!-- Phones only: account silhouette (right) in place of the Log in pill. -->
    <a class="sw-nav-account" data-sw-href="links.login" href="#" hidden>
      <span class="sw-sr">Log in</span>
      <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
        <circle cx="12" cy="8" r="4.2" />
        <path d="M3.5 21c0-4.4 3.8-7.5 8.5-7.5s8.5 3.1 8.5 7.5z" />
      </svg>
    </a>
  </div>
</header>
